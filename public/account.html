<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nykra — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#FBF4E8; color:#2A1810; font-family:"Mulish", sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .panel { background:#fff; border:1px solid #E4D6BE; padding:32px; width:100%; max-width:380px; }
  h1 { font-family:"Marcellus", serif; font-weight:400; font-size:21px; margin:0 0 18px; }
  .row { display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px solid #F2E9D8; }
  .row span:first-child { color:#8C7A66; }
  button { margin-top:20px; width:100%; background:#6B1E23; color:#FBF4E8; border:none; padding:11px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div class="panel">
  <h1>Your account</h1>
  <div id="info">Loading…</div>
  <button id="logout">Sign out</button>
</div>
<script>
  function renderUserInfo(user) {
    const infoEl = document.getElementById('info');
    infoEl.innerHTML = '';

    const rows = [
      ['Email', user.email],
      ['Member since', user.created_at],
      ['Last login', user.last_login_at ?? '—'],
    ];

    for (const [label, value] of rows) {
      const row = document.createElement('div');
      row.className = 'row';

      const key = document.createElement('span');
      key.textContent = label;

      const val = document.createElement('span');
      val.textContent = value ?? '—';

      row.appendChild(key);
      row.appendChild(val);
      infoEl.appendChild(row);
    }
  }

  fetch('/api/me').then(r => r.ok ? r.json() : Promise.reject())
    .then(({ user }) => {
      renderUserInfo(user);
    })
    .catch(() => { window.location.href = '/index.html'; });

  document.getElementById('logout').onclick = async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/index.html';
  };
</script>
</body>
</html>
